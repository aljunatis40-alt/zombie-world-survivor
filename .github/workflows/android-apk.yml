name: Android sample APK

on:
  workflow_dispatch:
  push:
    branches:
      - dev/godot-3d-foundation
    paths:
      - "**.gd"
      - "**.tscn"
      - "**.tres"
      - "*.svg"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/android-apk.yml"

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmdline-tools;latest" \
            "ndk;23.2.8568313" \
            "cmake;3.10.2.4988404"

      - name: Install Godot 4.3 and export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip
          sudo install -m 0755 Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          wget -q "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" -O templates.tpz
          unzip -q templates.tpz -d templates
          cp templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Configure Godot Android SDK paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          echo "Android SDK: $ANDROID_HOME"
          echo "Java SDK: $JAVA_HOME"
          test -x "$JAVA_HOME/bin/java"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/ndk/23.2.8568313"
          test -d "$ANDROID_HOME/cmake/3.10.2.4988404"

      - name: Import and validate project scripts
        run: |
          set -o pipefail
          godot --headless --verbose --path . --editor --quit 2>&1 | tee import-validation.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script" import-validation.log; then
            echo "Godot script validation failed."
            exit 1
          fi

      - name: Run main scene startup smoke test
        run: |
          set -o pipefail
          godot --headless --verbose --path . --quit-after 10 2>&1 | tee runtime-smoke-test.log
          # Godot's headless dummy renderer can emit mesh_get_surface_count
          # warnings for its non-rendering backend. The game now performs an
          # explicit scene-tree check and reports actual missing mesh resources
          # as NULL_MESH; keep script/resource failures fatal.
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|NULL_MESH:" runtime-smoke-test.log; then
            echo "Main scene startup or mesh validation failed."
            exit 1
          fi

      - name: Diagnose Android export configuration
        run: |
          echo "=== Android export preset ==="
          cat export_presets.cfg
          echo "=== Android texture compression setting ==="
          grep -n "import_etc2_astc" project.godot
          test "$(grep -c 'textures/vram_compression/import_etc2_astc=true' project.godot)" -eq 1
          grep -n 'version/code=11' export_presets.cfg
          grep -n 'package/icon="res://icon11.svg"' export_presets.cfg

      - name: Create temporary debug signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Export debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          JAVA_HOME: ${{ env.JAVA_HOME }}
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build/android
          mkdir -p "$GITHUB_WORKSPACE/.android"
          cp "$HOME/.android/debug.keystore" "$GITHUB_WORKSPACE/.android/debug.keystore"
          godot --headless --verbose --path . --export-debug "Android" build/android/ZombieWorldSurvivor-v0.2.0-Sample11.apk

      - name: Verify APK
        run: |
          test -s build/android/ZombieWorldSurvivor-v0.2.0-Sample11.apk
          ls -lh build/android/ZombieWorldSurvivor-v0.2.0-Sample11.apk

      - name: Upload sample APK
        uses: actions/upload-artifact@v4
        with:
          name: ZombieWorldSurvivor-Sample-11
          path: build/android/ZombieWorldSurvivor-v0.2.0-Sample11.apk
          if-no-files-found: error
          retention-days: 14
