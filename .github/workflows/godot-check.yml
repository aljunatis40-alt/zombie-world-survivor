name: Godot project validation

on:
  push:
    branches:
      - main
      - dev/godot-3d-foundation
  pull_request:
    branches:
      - main
      - dev/godot-3d-foundation

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Import project and parse scripts
        run: godot --headless --path . --editor --quit
